# identity и motion — только начальные значения: при первом запуске compass_core переносит их в
# {data_dir}/config/robot.yaml, дальше они меняются из Compass (Настройки → Робот).
compass_core:
  ros__parameters:
    robot_name: "compass-sim"
    serial_number: "sim-001"
    manufacturer: "compass"
    model: "TurtleBot4 (sim)"
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    scan_topic: "scan"            # sensor_msgs/LaserScan лидара
    odom_topic: "odom"            # nav_msgs/Odometry базы (для скорости в телеметрии)
    battery_topic: "battery_state"  # sensor_msgs/BatteryState; нет топика — «Нет данных»
    # Скорость в базу: false — geometry_msgs/Twist; true — TwistStamped (ros2_control в Jazzy).
    # Тот же тип должен быть у Nav2: enable_stamped_cmd_vel в nav2.yaml.
    cmd_vel_stamped: false
    holonomic: false    # true — робот ездит боком (меканум, омни): джойстик вбок, лимит Nav2 по y
    robot_radius: 0.22  # м — размер значка робота на карте Compass (как robot_radius в nav2.yaml)
    max_linear: 0.5     # м/с — предел для джойстика и Nav2
    max_angular: 1.0    # рад/с
