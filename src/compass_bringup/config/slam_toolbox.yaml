# slam_toolbox для TEACH_IN. Остальное — значения по умолчанию slam_toolbox
# (как в его mapper_params_online_async.yaml).
slam_toolbox:
  ros__parameters:
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 12.0        # лидар TurtleBot4 (RPLIDAR A1) — 12 м
    map_update_interval: 1.0     # /map раз в секунду — карта в Compass растёт на глазах
    transform_publish_period: 0.05
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    use_map_saver: false         # карту сохраняет compass_core
    enable_interactive_mode: false
    stack_size_to_use: 40000000  # большой posegraph сериализуется рекурсивно
