# identity и motion — только начальные значения: при первом запуске compass_core переносит их в
# {data_dir}/config/robot.yaml, дальше они меняются из Compass (Настройки → Робот).
compass_core:
  ros__parameters:
    robot_name: "compass-sim"
    serial_number: "sim-001"
    manufacturer: "compass"
    model: "TurtleBot4 (sim)"
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    max_linear: 0.5     # м/с — предел для джойстика и Nav2
    max_angular: 1.0    # рад/с
